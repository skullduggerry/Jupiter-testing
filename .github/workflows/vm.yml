# Installs Jupiter in a VM and checks what a person would see, end to end:
# scripts/vm.sh, every scenario of vm/test_install.py (phases 1 and 2 of the
# installer on the Arch ISO, LUKS, the TPM binding, Secure Boot, the recovery
# key, a kernel update, converting an install). The installer is checked out
# from main (or this branch, where it has it); weekly, as an install takes
# long and moves with Arch's packages, on demand, and on a push here that
# changes the rig.
#
# GitHub's runners have KVM. The rig keeps an install per set of answers and
# boots each test from a copy of one, which Btrfs makes at no cost, so its
# cache lives on a Btrfs in a file on the runner's larger disk. The tests run
# in vm/test_install.py's GROUPS, a job each at once, each installing what
# its own tests need: about ten minutes, where one job took thirty. A rig
# that cannot run fails the job rather than skip it; a failing job's serial
# logs are kept as an artifact of its own.
name: VM tests

on:
  push:
    paths:
      - "vm/**"
      - "scripts/vm.sh"
      - ".github/workflows/vm.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * 0"

# The token reads the repo, nothing more.
permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

env:
  # The branch the repos are laid out by.
  BRANCH: ${{ github.ref_name }}
  ISO_MIRROR: https://geo.mirror.pkgbuild.com/iso/latest

defaults:
  run:
    shell: bash

jobs:
  vm:
    name: "Arch: install in a VM (${{ matrix.group }})"
    runs-on: ubuntu-latest
    # A group takes ten minutes or so: a hung one fails within the hour.
    timeout-minutes: 60
    strategy:
      # Every group runs to its end: one failing says nothing of the others.
      fail-fast: false
      matrix:
        group: [unencrypted, encrypted, tpm, tpm-attacks]
    container:
      image: archlinux:latest
      # The runner's /mnt, its larger disk, for the VMs' Btrfs.
      options: --privileged -v /mnt:/host-mnt
    steps:
      - name: Install packages
        # The rig's (vm/rig.py's TOOLS and OVMF), Btrfs's, and what lays the
        # repos out.
        run: |
          pacman -Syu --noconfirm --needed git sudo python \
            qemu-system-x86 swtpm edk2-ovmf libarchive util-linux btrfs-progs
          pacman -Q qemu-system-x86 swtpm edk2-ovmf
      - name: Create test user with KVM access
        run: |
          useradd -m ci
          chmod 666 /dev/kvm
      - name: Create Btrfs image for VMs
        # Sparse: it takes only what the installs write.
        run: |
          df -h / /host-mnt
          truncate -s 200G /host-mnt/vms.img
          mkfs.btrfs -q /host-mnt/vms.img
          install -d -o ci /home/ci/.cache
          mount -o loop /host-mnt/vms.img /home/ci/.cache
          chown ci: /home/ci/.cache
      - name: Download Arch ISO
        run: |
          iso=/home/ci/.cache/jupiter-testing
          sudo -u ci mkdir -p "$iso"
          cd "$iso"
          sudo -u ci curl -fsSLO "$ISO_MIRROR/archlinux-x86_64.iso"
          sudo -u ci curl -fsSLO "$ISO_MIRROR/sha256sums.txt"
          grep ' archlinux-x86_64.iso$' sha256sums.txt | sha256sum -c -
      - uses: actions/checkout@v7
        with:
          path: checkout
      - name: Clone repos
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          sudo -u ci -H env GIT_TERMINAL_PROMPT=0 bash checkout/scripts/ci-repos.sh checkout "$BRANCH"
          # The whole history: one scenario installs an old revision.
          sudo -u ci -H git -C Jupiter-installer fetch --quiet --unshallow
      - name: Check VM prerequisites
        # Its tests skip where it cannot, which would pass unseen here.
        run: |
          cd Jupiter-testing
          sudo -u ci -H python3 -c 'from vm import rig; why = rig.missing(); print(why or "ok"); raise SystemExit(1 if why else 0)'
      - name: Run VM tests
        run: |
          cd Jupiter-testing
          sudo -u ci -H env JUPITER_VM_GROUP=${{ matrix.group }} scripts/vm.sh
      - name: Show disk usage
        if: always()
        run: df -h /home/ci/.cache /host-mnt || true
      - name: Upload VM logs
        # On a timeout too, when the serial logs matter most.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs-${{ matrix.group }}
          path: |
            /home/ci/.cache/jupiter-testing/vm/*/serial-*.log
            /home/ci/.cache/jupiter-testing/vm/*/phases.log
            /home/ci/.cache/jupiter-testing/vm/*/qemu.log
            /home/ci/.cache/jupiter-testing/vm/*/swtpm.log
          if-no-files-found: ignore
