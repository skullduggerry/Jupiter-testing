# Runs ./check.sh (Jupiter-testing's linters and suites) on every push and
# pull request, in an Arch container, so the checks don't need a desktop.
# The same file in every Jupiter repo, with the other two cloned next to the
# checkout, as on the desktop. Privileged: the suites' stand-ins use unshare.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      REPO: ${{ github.event.repository.name }}
    steps:
      - name: Install tools
        # What Jupiter-testing's lint.sh and test.sh ask for, plus what
        # Jupiter-installer's packages/pacman.txt lists for the checks (mypy's
        # stubs, the VM's firmware); [multilib] for the package-list test.
        run: |
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git sudo rust \
            ruff mypy python-types-python-dateutil python-pygobject-stubs \
            shellcheck shfmt stylua lua lua-language-server zsh \
            qt6-declarative hyprland quickshell uwsm \
            python-coverage python-dateutil python-gobject python-pyxdg \
            util-linux file xdg-user-dirs qemu-system-x86 swtpm edk2-ovmf
      - name: Add an unprivileged user
        # Root reads every file, which the permission checks rely on not doing.
        run: useradd -m ci
      - if: env.REPO == 'Jupiter-dotfiles'
        id: wallust
        uses: actions/cache/restore@v4
        with:
          path: /home/ci/.cargo
          key: cargo-wallust-3.5.1
      - name: Install wallust
        # Built by cargo, as on the desktop (apply.sh looks in ~/.cargo/bin).
        if: env.REPO == 'Jupiter-dotfiles' && steps.wallust.outputs.cache-hit != 'true'
        run: |
          chown -R ci: /home/ci
          sudo -u ci -H cargo install --locked wallust --version 3.5.1
      # Saved straight away, so a failing check doesn't cost the next run the build.
      - if: env.REPO == 'Jupiter-dotfiles' && steps.wallust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/ci/.cargo
          key: cargo-wallust-3.5.1
      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
      - name: Check
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          for repo in Jupiter-dotfiles Jupiter-installer Jupiter-testing; do
            [ -d "$repo" ] || sudo -u ci -H git clone --quiet --depth 1 \
              "https://github.com/skullduggerry/$repo.git" "$repo"
          done
          cd "$REPO"
          sudo -u ci -H env PATH="/home/ci/.cargo/bin:$PATH" ./check.sh
