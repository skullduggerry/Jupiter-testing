#%PAM-1.0
# A reader no finger matches: it says what pam_fprintd says, notes the try,
# and ends as pam_fprintd does once its one try is used up (PAM_MAXTRIES).
auth    optional    pam_echo.so    Place your finger on the fingerprint reader
auth    optional    pam_exec.so    quiet @FIXTURES@/tried
auth    required    pam_debug.so   auth=maxtries
